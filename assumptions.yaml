# =====================================================================
# assumptions.yaml - every input for the Capacity Model, with comments
# Northbrook Records Services is FICTIONAL. All data here is SYNTHETIC.
# Source of truth: docs/Capacity_Model_Spec.md
#
# SESSION 2 SKELETON. This file holds only the inputs Session 2 needs:
# the calendar, the request-type mix, and the demand ingredients (spec 3.1).
# Later sessions add workload (4), supply (5), cost and coverage (6), and
# scenarios (7). Every number is an illustrative starting assumption, not an
# industry benchmark.
#
# Rule from CLAUDE.md: no number is hard-coded in the logic. If a value is
# not in a YAML file, the code should not know it.
# =====================================================================

meta:
  model_name: "Northbrook Records Services Capacity Model (synthetic)"
  spec: "docs/Capacity_Model_Spec.md"
  spec_approved: 2026-10-21      # Session 1 deliverable, approved by Siri
  data_statement: "All data is synthetic, generated by this code. No real company, patient, or employee data."

# ---------------------------------------------------------------------
# PATHS. Written here rather than in the code so a run can be redirected
# without touching logic. SYNTHETIC is in every generated file name, per
# CLAUDE.md, so a file can never be mistaken for real data once it leaves
# the repository.
# ---------------------------------------------------------------------
paths:
  synthetic_data_dir: "data/synthetic"
  outputs_dir: "outputs"
  requests_history_csv: "requests_history_SYNTHETIC.csv"
  requests_forecast_csv: "requests_forecast_SYNTHETIC.csv"
  forecast_scores_csv: "forecast_holdout_mape_SYNTHETIC.csv"
  work_volume_csv: "work_volume_SYNTHETIC.csv"
  work_volume_spill_csv: "work_volume_conservation_SYNTHETIC.csv"
  history_chart_png: "history_SYNTHETIC.png"
  forecast_chart_png: "forecast_SYNTHETIC.png"
  intraday_chart_png: "intraday_SYNTHETIC.png"
  onsite_intervals_csv: "onsite_intervals_SYNTHETIC.csv"
  onsite_days_csv: "onsite_days_SYNTHETIC.csv"
  required_hours_csv: "required_hours_SYNTHETIC.csv"
  backlog_queues_csv: "backlog_queues_SYNTHETIC.csv"
  capacity_ledger_csv: "capacity_ledger_SYNTHETIC.csv"
  ledger_daily_csv: "ledger_daily_SYNTHETIC.csv"
  plan_gap_csv: "plan_gap_SYNTHETIC.csv"
  plan_queues_csv: "plan_queues_SYNTHETIC.csv"
  plan_cost_csv: "plan_cost_SYNTHETIC.csv"
  plan_turnaround_csv: "plan_turnaround_SYNTHETIC.csv"
  plan_onsite_csv: "plan_onsite_SYNTHETIC.csv"
  coverage_events_csv: "coverage_events_SYNTHETIC.csv"
  hiring_plan_csv: "hiring_plan_SYNTHETIC.csv"
  automation_csv: "automation_SYNTHETIC.csv"
  next_dollar_csv: "next_dollar_SYNTHETIC.csv"
  scenarios_dir: "scenarios"
  scenario_comparison_csv: "scenario_comparison_SYNTHETIC.csv"
  monday_sweep_csv: "monday_part_time_sweep_SYNTHETIC.csv"
  onsite_day_chart_png: "onsite_day_SYNTHETIC.png"
  # The Excel workbook a leader opens without Python (spec Section 8).
  # SYNTHETIC is in the file name as well as on every tab, because a
  # workbook is the one output that gets forwarded by email with its
  # provenance stripped off.
  workbook_xlsx: "capacity_model_workbook_SYNTHETIC.xlsx"

# ---------------------------------------------------------------------
# SCENARIO (spec Section 7)
#
# THIS FILE IS THE BASELINE. A scenario is a small overrides file in
# scenarios/ laid on top of it, so a scenario changes only the inputs it
# names and everything else flows through the same logic. That is the whole
# design: one chain, several sets of inputs, and no second code path that
# could quietly disagree with the first.
#
# Two rules from spec 7, decided 10/27:
#
#   - Every scenario starts from the BASELINE ROSTER. Starting headcount is
#     tuned once, on the baseline, and held. A scenario that re-tuned its
#     own roster would open balanced and report no gap at all, which would
#     hide the very thing the scenario is asking about.
#   - A scenario's changes take effect from its STARTS WEEK; the weeks
#     before it match the baseline. "Volume rises 15% in week 20" is a
#     different question from "volume was always 15% higher", and the
#     history is never touched either way.
#
# The two multipliers below are the mechanism for the first two scenarios
# in the 7 table. They sit at 1.0 here, so the baseline is unchanged - and
# the regression pins prove it.
# ---------------------------------------------------------------------
scenario:
  name: "Baseline"
  starts_week: 1                       # plan week the changes begin
  what_it_changes: "Nothing; phones answered per site; 2 Records Specialists at every site"

  # Spec 7: "Requests x 1.15, all sites". Applied to the PLAN forecast from
  # the starts week onward, never to the 156 weeks of history - a scenario
  # asks what happens next year, not what would have happened last year.
  demand_multiplier: 1.0

  # Spec 7: "Monthly attrition x 2, all roles". Applied to the MONTHLY rate
  # before the weekly conversion, because doubling a monthly rate is not
  # the same as doubling the weekly one it converts to: 2.5% monthly is
  # 0.5826% weekly, and 5.0% monthly is 1.1767%, not 1.1651%.
  attrition_multiplier: 1.0

  # -------------------------------------------------------------------
  # MONDAY SCHEDULING (spec 7, decided 10/27)
  #
  # After hiring the counter still leaves about 420 uncovered hours a
  # year, every gap under the 1-FTE hiring trigger, because Monday carries
  # 23% of the week against a roster that works the same hours every day.
  # That is a SCHEDULING problem, not a staffing one - another hire would
  # sit idle on Friday - and this block is the only way the model can say
  # so with a number.
  #
  # It reshapes WHEN a role's paid hours are worked, never how many. The
  # weights always average 1.0 across the five days, so weekly paid hours
  # are identical to the baseline in every shape, and the demand side is
  # untouched.
  #
  #   flat         every day the same. The baseline, and the reason the
  #                420 hours exist.
  #   ideal_match  each day's hours follow the day-of-week pattern exactly
  #                (23/21/20/19/17). An UPPER BOUND, not a roster: it needs
  #                fractional people on every day of the week.
  #   part_time    the realistic version. A share of paid hours leaves the
  #                full-time roster, cut evenly across all five days, and
  #                comes back on the days that are busiest.
  #
  # Sites are open 8:00 to 17:00 (3.4), so nobody can work a longer
  # Monday. The hours move through WHO is scheduled, not longer shifts.
  # -------------------------------------------------------------------
  # -------------------------------------------------------------------
  # SITE SHORTFALL (spec 7 "Site shortfall")
  #
  # One site loses a share of a role's hours for a few weeks, starting at
  # the scenario's own starts week. It is the test cluster coverage exists
  # for: a single site in trouble while its neighbours carry on as normal.
  #
  # The people are still PAID. A four-week absence is leave, sickness or a
  # secondment, not a resignation, so headcount, cost and the overtime cap
  # all stay at baseline and the scenario reports the cost of covering the
  # gap rather than a payroll saving that would flatter it.
  # -------------------------------------------------------------------
  site_shortfall:
    site: ""                           # empty: no shortfall anywhere
    roles: [onsite_associate]
    share_of_hours_lost: 0.0
    weeks: 0                           # from the scenario's starts week

  # -------------------------------------------------------------------
  # DEFLECTION, THE DEMAND SIDE (spec 7.1, decided 10/21)
  #
  # The other half of the AI story, and the half that is easy to get
  # wrong. Deflection means the contact NEVER ARRIVES: the requester finds
  # their answer on a portal or an AI handles it, so there is no call to
  # staff. Automation (5.4) is the opposite - the work still arrives and a
  # machine does it.
  #
  # Removing contacts removes the EASY ones, so what is left is a harder
  # mix. Spec 7.2, revised 10/28, splits that into two things that were
  # being charged as one:
  #
  #   MIX UPLIFT, calculated and not an input. The deflected contacts were
  #     cheap, so the ones left average more minutes each:
  #
  #       mix uplift = (1 - removed share x easy ratio)
  #                    / (1 - removed share) - 1
  #
  #     About +4.3% at these defaults. It cannot be chosen, and it cannot
  #     raise total WORKLOAD however large it gets: even if the removed
  #     calls had taken zero minutes the workload would only stay flat.
  #     That is the ceiling, 1/(1 - removed share) - 1 = 8.7% here, and a
  #     flat +10% uplift - what this model used until 10/28 - implied the
  #     removed calls took less than zero minutes.
  #
  #   ESCALATION UPLIFT, an input, default 0%. A contact that tried AI or
  #     self-service first and reached a person anyway is genuinely harder
  #     than one that rang straight through: the requester has already
  #     failed once and is further into their problem. THIS is what can
  #     make deflection cost hours, and the break-even is 4.17% at these
  #     defaults (200 minutes saved over 4,800 remaining).
  #
  # Realization is NOT repeated here. Spec 7.1 has one realization field
  # applying to both sides, and it lives in automation.rates.realization,
  # so the two halves cannot drift apart. It scales the rates and the
  # escalation; the mix uplift follows from the share actually removed.
  # -------------------------------------------------------------------
  deflection:
    enabled: false
    simple_contact_share: 0.40         # 7.1: status calls and emails
    ai_deflection: 0.15                # 7.1: of simple contacts
    self_service: 0.05                 # 7.1: of simple contacts
    # What a deflected contact took, against the average for its type.
    # Half: a status call answered by a portal is the short one.
    easy_handle_time_relative: 0.50    # 7.1, decided 10/28
    escalation_uplift: 0.0             # 7.1, decided 10/28
    # Status and help calls, and emails and portal messages. NOT walk-ins:
    # a requester standing at the counter has already arrived, and a kiosk
    # is a different input (Section 1, W19).
    work_types: [W20, W21]
    apply_to_all_volume: false

  # -------------------------------------------------------------------
  # CENTRALIZED PHONES (spec 7, decided 10/27)
  #
  # One large queue needs fewer people than six small ones for the same
  # service level, because Erlang C pools the randomness: six sites each
  # keeping somebody free in case the phone rings keep six people free,
  # and one network queue keeps fewer.
  #
  # Three things work against that gain and the scenario reports each
  # separately, because they pull in different directions:
  #
  #   - the 85% OCCUPANCY CAP bites hardest in large queues. Session 3
  #     found that at 500 Erlangs, 510 staff meet the service level and
  #     the cap demands 589. A pooling gain the cap takes straight back
  #     is not a gain.
  #   - LOCAL KNOWLEDGE is lost, so centralized calls take longer. The
  #     uplift below is the price of that.
  #   - the sites lose their BLENDED team (4.1). Today one person answers
  #     the phone between requesters; afterwards the counter staffs
  #     walk-ins alone at 90% in 10 minutes, and a counter that quiet
  #     still needs somebody standing at it.
  #
  # That third effect is the one the scenario exists to measure, and it is
  # the one a pooling argument on its own would miss.
  # -------------------------------------------------------------------
  central_phones:
    enabled: false
    handle_time_uplift: 0.05           # spec 7: +5% for lost local knowledge
    # How the central team's hours are charged back to the sites. The
    # hours come OUT of the Onsite Associates (spec 7), who sit at six
    # sites, so the requirement has to land somewhere: pro rata by the
    # calls each site sends the queue, which is also what makes the
    # pooling gain shared rather than captured by one site.
    allocate_to_sites_by: calls

  # -------------------------------------------------------------------
  # COORDINATED DIGITIZATION (spec Section 7, decided 10/28)
  #
  # The baseline converts records REACTIVELY: every onsite retrieval (W11)
  # drags a digitization item (W12) behind it. But that conversion never
  # feeds back into the media mix - the non-digital share is a constant
  # 11% in every week of the baseline - so the work is done and the
  # benefit is never banked. This scenario does it the other way round:
  # convert AHEAD of demand and let the share actually fall.
  #
  # The WFM idea is the one that makes any backlog-reduction project work,
  # and it is not "do more work". It is that a unit of work done once
  # removes a RECURRING unit of work. A chart converted this week is a
  # chart nobody walks to a cabinet for again - this year or next.
  #
  # Ordering matters as well as rate. Requests are concentrated, so
  # converting most-likely-requested FIRST makes the requested non-digital
  # share fall faster than the converted share does. Converting in archive
  # order would be the same effort for less of the early benefit.
  #
  # The hours are ADDED paid hours, not borrowed from the Records
  # Specialists' existing week. Borrowing them would make the project look
  # free while quietly starving the retrieval queue, which is how this
  # kind of project usually fails in practice.
  #
  # -------------------------------------------------------------------
  # CALIBRATED TO THE MODEL'S OWN HISTORY (revised 11/02)
  #
  # The first defaults - 250,000 charts, 20% of the archive drawing 80% of
  # requests - contradicted the history they were supposed to sit next to,
  # and badly.
  #
  # The baseline pulls 57,383 charts from paper over the 156-week history
  # and digitizes every one of them. Against a 250,000-chart archive that
  # is 23% of the whole archive converted, and reactive conversion is the
  # most aggressive ordering there is - a chart is converted BECAUSE it was
  # requested, so the hot records go first without anyone deciding they
  # should. At 80-20 that would have dragged the paper share from 11.00%
  # to 5.59%: a 5.4-point fall, where the history the model generates is
  # flat at 11.00% in all 156 weeks. Eleven times the half-point of drift
  # a flat history can hide.
  #
  # So the archive is calibrated rather than illustrative. Treating each
  # chart as sitting on paper until its first request digitizes it:
  #
  #   drift over t weeks = 11 x (R t / N) x D,
  #       R = onsite requests a week, N = archive,
  #       D = b^2/a + (1-b)^2/(1-a)   (the request-weighted mean density)
  #
  # Requiring the drift under half a point over the 156 history weeks pins
  # ONE quantity, N / D > (11 / 0.5) x 57,383 = 1,262,435. It says nothing
  # about the archive or the concentration on its own.
  #
  # The second number comes from asking which concentration is most
  # GENEROUS to the project, so the scenario's answer cannot be blamed on
  # a pessimistic input. The project's benefit runs off the HOT density
  # b/a, the history constraint off the mean density D, so what matters is
  # (b/a) / D. Holding the hot tier at the fifth of the archive the spec
  # names, that is largest at b = 1/sqrt(5) = 0.447, i.e. 0.45 to the
  # precision worth stating.
  #
  # The telling part: (b/a)/D runs from 1.00 at no concentration to 1.618
  # at the optimum and back to 1.23 at 80-20. CONCENTRATION IS WORTH AT
  # MOST 1.6x once the history is honoured, not the 4x the old defaults
  # suggested - because concentration cuts both ways. It makes the
  # project's ordering efficient, and it makes reactive conversion
  # efficient too, which forces the archive bigger to keep the history
  # flat. The two effects very nearly cancel.
  # -------------------------------------------------------------------
  digitization:
    enabled: false
    # 40 hours a week across the network, at 4 items an hour - W12's own
    # 15-minute handle time, so the project is not assumed to be faster at
    # the job than the people already doing it.
    hours_per_week: 40                 # spec 7, decided 10/28
    items_per_hour: 4                  # = W12's 15 minutes
    # Paid at the Records Specialist rate: it is their job, done by a
    # project team.
    project_role: records_specialist

    # The paper archive, network-wide, split across sites by size factor.
    # The smallest round million that keeps the history's drift under half
    # a point (it comes out at 0.43), so it is the most generous archive
    # the calibration allows. It implies a given paper chart is pulled
    # about once a century, which is what a flat paper share over three
    # years means: repeat requests for the same chart are rare.
    archive_charts: 2000000            # calibrated 11/02, was 250,000

    # Request concentration: this share of the archive draws that share of
    # the onsite requests. Converted most-likely-requested first, among
    # the charts not yet requested.
    concentration_archive_share: 0.20  # spec 7, decided 10/28
    concentration_request_share: 0.45  # calibrated 11/02, was 0.80

    # Onsite retrievals a week in the history: 57,383 W11 items over 156
    # weeks. MEASURED from the model's own generated history, not chosen -
    # it is what the two numbers above are calibrated against, so it is
    # recorded here where they can be checked together rather than left
    # implicit. A Section 9 test re-measures it and fails if it drifts.
    #
    # It also depletes the archive the project draws from: by the time the
    # plan starts, the history's own reactive conversions have already
    # taken records off the shelf, and the project cannot convert a chart
    # that has already been requested.
    reactive_conversions_per_week: 367.84   # measured 11/02
    # Half a point of drift over the history window is what a flat 11%
    # share can hide (spec 7, Siri 11/02). The calibration above is solved
    # against this budget, and Section 9 checks it still holds.
    history_drift_budget_points: 0.5

  # -------------------------------------------------------------------
  # CENTRAL RECORDS HUB (spec Section 7, decided 11/02)
  #
  # Every non-digital record held at one site, with one pooled team
  # retrieving for the whole network and sending items on by interoffice
  # delivery. The pooling case and the pooling cost, in one scenario.
  #
  # THE WFM IDEA, and why it is not the same as the phone-pooling one.
  #
  # Centralized phones wins through ERLANG: one large random queue needs
  # proportionally less spare capacity than six small ones. That gain is
  # free, because a call does not have to travel.
  #
  # A records hub cannot win that way, because retrieval is BACKLOG work,
  # not a live queue. Backlog work has no Erlang penalty to pool away:
  # 100 hours of chart pulls is 100 hours whether it sits at one site or
  # six.
  #
  # What it buys instead is ROUNDING, not the 2-per-site floor the spec
  # paragraph points at (measured 11/02). Sized against this model's
  # volumes every site needs about 2.2 to 2.8 Records Specialists anyway,
  # so the floor binds only at the smallest site and is worth 0.097 FTE
  # network-wide. But six sites each round a fractional requirement up to
  # a whole person: 14.254 FTE of work becomes 17 people at six sites and
  # 15 at one hub. See src/capacity_model/hub.py for the measurement.
  #
  # And it buys that by paying twice:
  #
  #   DELIVERY. A chart pulled at the hub for another site has to get
  #     there. 1 business day inside a cluster, 2 between - added to the
  #     turnaround of every hub-retrieved item, so the service cost of
  #     pooling is visible rather than assumed away.
  #
  #   COUNTER HELP. Spec 4.5 gives half a Records Specialist's spare
  #     hours to their own site's counter. Take the Records Specialists
  #     out of five sites and that help goes with them, so Onsite
  #     Associates have to cover what the help was covering.
  #
  # NOT MODELLED, and it matters: the one-time cost of physically moving
  # the paper archive to the hub. Boxes, trucks, re-indexing, and the
  # retrieval service running at two addresses while it happens. So every
  # figure this scenario reports is an UPPER BOUND on the hub's case.
  # -------------------------------------------------------------------
  records_hub:
    enabled: false

    # Empty means CHOOSE: the site with the lowest volume-weighted
    # delivery days across the network (spec 7, 11/02). Named here only
    # to override the choice and test a different hub.
    site: ""

    # Interoffice delivery, in business days (spec 7 defaults). Zero
    # within the hub's own site - the record is already there, which is
    # the whole reason the choice is volume-weighted.
    delivery_days_within_cluster: 1
    delivery_days_between_clusters: 2

    # 0 means SIZE IT FROM THE WORK: the hub team is its required hours
    # over productive hours per person, floored the same way a site is.
    # The floor is the point of the scenario, so it is not special-cased
    # away - it just applies once instead of six times.
    team_size: 0

    # All Records Specialist work moves, not only the retrieval of paper.
    # W11 onsite retrieval, W12 digitization and W13 missing-record search
    # are the archive work; W17 certified copies and notarization is not,
    # but it is Records Specialist work and there are no Records
    # Specialists left at the other five sites to do it (Siri 11/02). It
    # follows the people.
    moved_work_types: [W11, W12, W13, W17]

    # Which of them carry the delivery days in turnaround: the ones where
    # a physical record travels. W12 digitization is off the request's
    # path already (spec 4.4), and W17 is a Release-stage task rather
    # than a retrieved item (Siri 11/02), so neither is listed.
    delivery_work_types: [W11, W13]

  # -------------------------------------------------------------------
  # AFTER PROOF OF CONCEPT (spec Section 7, added 11/02)
  #
  # The only saving a proof of concept actually unlocks is a lower QA
  # SAMPLE. Of the three pieces human-in-the-loop sends back (spec 5.5),
  # two are not about trust at all:
  #
  #   EXCEPTIONS are a property of the work. Hard items stay hard however
  #     accurate the machine is on the easy ones.
  #   LEGAL SIGN-OFF is a property of the LAW. Where a statute says a
  #     person must decide (spec Section 1: W7, R8 releases,
  #     notarization), a measured error rate is evidence about the
  #     machine and says nothing about the statute. It moves only if the
  #     requirement itself changed, which is the input below and is
  #     false by default.
  #
  #   THE QA SAMPLE is a property of trust, and trust can be earned. It
  #     is set high at go-live because nobody knows how good the machine
  #     is yet, and sampling is how you find out.
  #
  # WHY THE GATE IS SLOW. The true error rate is an input and nobody ever
  # observes it. What the operation sees is the rate in the sample it
  # reviewed, which is a binomial draw:
  #
  #     errors this week ~ Binomial(items sampled, true error rate)
  #
  # At a 0.3% true rate against a 0.5% target, a week sampling 300 items
  # reads clean; a week sampling 30 reads 3.3% the moment one error turns
  # up, and the 12-week clock starts over. So a thin sample does not just
  # delay the gate, it can stall it for good - and that is the point of
  # modelling it at all rather than assuming week 27.
  #
  # And the saving feeds back on the measurement: halving the sample
  # halves the evidence, exactly when everyone has stopped watching. The
  # report prints the sampled count every week so that is visible.
  # -------------------------------------------------------------------
  proof_of_concept:
    enabled: false

    # Spec 7 defaults: the rate it has to hold, and for how long.
    target_error_rate: 0.005
    weeks_to_hold: 12

    # The machine's REAL error rate. Illustrative (Siri 11/02), and never
    # observed by the operation - only sampled. The sensitivity run sits
    # it right on the target, where luck decides half the weeks.
    true_error_rate: 0.003

    # Spec 7 default: "the lower QA sample rates to use after the gate
    # (default half of each row's rate)". Held as a MULTIPLE rather than a
    # replacement table so the rows keep their relative order - W7's 100%
    # review and W3's 2% are not the same decision and must not collapse
    # into the same number.
    after_gate_qa_multiple: 0.5

    # Spec 7: "legally required sign-offs change only if the legal
    # requirement allows". Default UNCHANGED, and the rate below is
    # ignored entirely while this is false, so it cannot leak into a run
    # on its own. A Section 9 check holds sign-off at 100% unless this
    # says the requirement itself moved.
    legal_requirement_changed: false
    after_gate_sign_off_rate: 1.0

    # Fixed, so the sampled weeks repeat exactly from run to run.
    seed: 20270111

  onsite_schedule:
    roles: [onsite_associate]
    shape: flat                        # flat | ideal_match | part_time

    # Share of the role's paid hours that moves to part-timers. Spec 7
    # default for the scenario is 10%; the baseline moves none.
    part_time_share: 0.0

    # Which days the part-timers work. Their hours split between these in
    # proportion to how far each day sits ABOVE an even share - Monday is
    # 3 points above 20% and Tuesday 1, so 75/25. Derived rather than
    # stated, so the split follows the day-of-week pattern if it is ever
    # revised instead of quietly disagreeing with it.
    part_time_days: [monday, tuesday]

# ---------------------------------------------------------------------
# CALENDAR (spec 2 "How the model fits together"; decided 10/21, spec 10)
# Weekly grain. Each week is labelled by its Monday.
# History runs first, then the plan picks up on the very next Monday, so
# the two series are contiguous with no gap and no overlap.
# ---------------------------------------------------------------------
calendar:
  grain: weekly                   # spec 2: every calculation is per site, role, week
  week_start_day: monday          # spec 2: weeks start Monday
  history_start: 2024-01-08       # spec 2, revised 10/21: 156 weeks of synthetic history start here
  history_weeks: 156              # spec 2, revised 10/21: 3 x 52 weeks
  plan_start: 2027-01-04          # spec 2: 52 weeks forward start here
  plan_weeks: 52                  # spec 2
  holdout_weeks: 13               # spec 3.2: forecast methods are scored on a 13-week holdout
  seasonal_cycle_weeks: 52        # spec 3.2: length of the seasonal cycle the index is keyed to
  business_days_per_week: 5       # spec 3.4: sites open Mon-Fri

# Why 156 weeks and why this start date (decided 10/21, see spec 3.2):
#   - Holt-Winters needs 2 full seasonal cycles (104 weeks) just to initialise
#     52 seasonal indices. A 13-week holdout off 104 weeks leaves 91 training
#     weeks, and statsmodels refuses to fit. 156 weeks leaves 143, so both
#     methods get a real seasonal fit on the same holdout.
#   - 2024-01-08 is exactly 156 weeks before plan_start, so history runs
#     straight into the plan with no gap, and 156 = 3 x 52 keeps whole years.

# ---------------------------------------------------------------------
# REPRODUCIBILITY (spec 3.1 "fixed random seed so runs repeat";
# spec 9 Session 2 check: "same seed produces identical data on every run")
# ---------------------------------------------------------------------
random:
  seed: 20270104                  # spec 3.1 "Random seed", decided 10/21

# ---------------------------------------------------------------------
# DEMAND INGREDIENTS (spec 3.1 "Synthetic history")
#
# Formula (spec 3.1):
#   Requests (site, week) = base
#                           x site size
#                           x (1 + annual growth) ^ (week / 52)
#                           x season
#                           x holiday
#                           x (1 + noise)
#
# Week is 0-based, so the first week of history sits at the base rate and
# growth compounds from there.
# Season and holiday are mutually exclusive (see holiday.replaces_season).
#
# The WFM idea: we choose the truth on purpose. Because we know the growth
# and the seasonality that went in, the forecast in 3.2 can be graded
# against the real answer instead of against an opinion.
# Site size factors live in sites.yaml (spec 3.1 "set per site").
# ---------------------------------------------------------------------
demand:
  base_requests_per_site_per_week: 300   # spec 3.1 default
  annual_growth: 0.06                    # spec 3.1 default: 6% a year, compounded weekly as (1+g)^(week/52)

  # Season (spec 3.1, decided 10/21): set by the CALENDAR DATE of the week's
  # Monday, not by week number, because some years have 53 weeks and a
  # week-number rule would drift against the calendar.
  # The first period that matches a week wins; a week matching none gets
  # default_factor. The holiday factor still overrides whatever wins here.
  #
  # Two rule types:
  #   date_window           - the week's Monday falls in a month/day range
  #   weeks_before_holiday  - the week sits N weeks before the week that
  #                           contains a named holiday, so the rule tracks
  #                           the holiday as it moves year to year
  season:
    default_factor: 1.0
    periods:
      - name: "Q1 lift"                  # spec 3.1: +10%, Monday in Jan 1 - Mar 31
        rule: date_window
        from: {month: 1, day: 1}
        to: {month: 3, day: 31}          # inclusive
        factor: 1.10
      # Revised 10/21 (spec 3.1). The original rule was a Dec 18-31 window on
      # the Monday, and it never once fired: every Monday in that range is
      # also a Christmas or New Year week, and the holiday factor replaces
      # the season factor. The dip is now a pre-holiday slowdown in the week
      # BEFORE Christmas week, which is a real pattern - requesters push work
      # out before the holiday - and which can actually be observed.
      - name: "Pre-Christmas slowdown"   # spec 3.1: -8%
        rule: weeks_before_holiday
        holiday: "Christmas"
        weeks_before: 1
        factor: 0.92

  # Holiday weeks (spec 3.1, decided 10/21): the Mon-Sun week CONTAINING the
  # holiday. The holiday factor REPLACES the season factor for that week; the
  # two never stack. So a Christmas week sitting inside the late-December dip
  # is x0.6, not x0.6 x 0.92.
  holiday:
    factor: 0.60                         # spec 3.1 default
    replaces_season: true                # spec 3.1: "Replaces the season factor in that week; never stacks on it"
    weeks:                               # spec 3.1 names these four
      - name: "New Year"
        rule: "fixed"
        month: 1
        day: 1
      - name: "Independence Day"
        rule: "fixed"
        month: 7
        day: 4
      - name: "Thanksgiving"
        rule: "nth_weekday"              # 4th Thursday of November
        month: 11
        weekday: thursday
        nth: 4
      - name: "Christmas"
        rule: "fixed"
        month: 12
        day: 25

  # Noise (spec 3.1): normal, 5% standard deviation, drawn with the fixed
  # seed above. This is what makes the history look real rather than smooth,
  # and it is what the forecast has to see through.
  noise:
    distribution: normal
    mean: 0.0
    std_dev: 0.05                        # spec 3.1 default

  # Request-type mix drift (spec 3.1, decided 10/21): RELATIVE drift.
  # Each week every share is multiplied by (1 + a normal draw with 5%
  # standard deviation), then all shares are rescaled to sum to 100%.
  #
  # Relative, not absolute, matters here: a 5% wobble on R1's 35% share moves
  # it about 1.75 points, while the same 5% on R11's 2% share moves it about
  # 0.1 points. Big request types move in big absolute amounts and small ones
  # stay small, instead of a flat point-wobble swamping the rare types or
  # pushing them negative.
  mix_drift:
    distribution: normal
    relative_std_dev: 0.05               # spec 3.1: 5% of each share's own size
    renormalize_to_one: true             # spec 3.1: "then shares are rescaled to 100%"

# ---------------------------------------------------------------------
# FORECAST (spec 3.2)
#
# Two methods race on the same 13-week holdout and the better one is used.
# Keeping a challenger is the point: a single method with no comparison has
# no evidence behind it, and "we tested it against an alternative" is the
# answer to "why this forecast?".
# ---------------------------------------------------------------------
forecast:
  # Decided 10/21: the seasonal index is keyed to POSITION IN A 52-WEEK CYCLE
  # anchored at the history start, not to the ISO week number.
  #
  # Why: 2026 is a 53-week ISO year. Under ISO keying, history week 155
  # (Mon 2026-12-28) is week 53 - an index estimated from one observation and
  # never used by the plan - while ISO week 1 appears once in history as a
  # x0.6 New Year week. The first plan week, an ordinary Q1 week, would key
  # to it and forecast about 55% of the truth. Cycle position keeps week p of
  # the plan paired with weeks p, p+52, p+104 of history, which is how the
  # data is actually built.
  seasonal_index_key: cycle_position   # cycle_position | iso_week

  # Decided 10/21: ONE method is chosen for all six sites, on pooled holdout
  # MAPE across every site-week. Per-site winners would forecast better by a
  # hair but leave the model a mix of methods that can flip site by site when
  # an assumption changes - harder to explain and harder to test.
  method_selection: network            # network | per_site

  mape_target: 0.10                    # spec 9: chosen method must score 10% or less

  # Known calendar events (spec 3.2, added 10/21). Holiday weeks and the
  # pre-Christmas dip are not a pattern to be discovered - we know the dates
  # years ahead. So their effect is divided out of the history before either
  # method is fitted, and multiplied back onto the target weeks by DATE.
  #
  # Two things this buys:
  #   - the methods fit a smoother series and stop spending their seasonal
  #     index on weeks whose cause is already known
  #   - holidays land on the right plan week even when they move off the
  #     52-week grid, which cycle position alone cannot guarantee
  #
  # estimate_factors_from_history is the honest setting and the default. The
  # model learns HOW BIG each event is from the training weeks and takes only
  # the DATES from the calendar. Reading demand.holiday.factor directly would
  # hand the forecast an answer the generator wrote, and the holdout score
  # would flatter it.
  calendar_events:
    enabled: true
    estimate_factors_from_history: true

  # Classical decomposition (the baseline). Multiplicative, because the
  # ingredients in 3.1 multiply: a holiday week is x0.6 of whatever the
  # trend is, not a fixed number of requests fewer.
  decomposition:
    model: multiplicative
    # The first trend line is fitted through a series that still carries its
    # seasonality, so it is pulled slightly off and the seasonal index
    # inherits the error. Each pass re-measures the index against a cleaner
    # trend; the error falls about 7x a pass (0.19% after one, 0.03% after
    # two), so the fit iterates until the index stops moving rather than
    # guessing a pass count. max_refinement_passes is only a safety stop.
    refinement_tolerance: 1.0e-10
    max_refinement_passes: 50

  # Holt-Winters (the challenger), passed straight to statsmodels.
  holt_winters:
    trend: add
    seasonal: mul
    damped_trend: false
    initialization_method: estimated

# ---------------------------------------------------------------------
# REQUEST TYPES (spec Section 1 "Request types and skills", approved 10/21)
#
# share              - long-run share of all requests received
# charts_per_request - how many charts one request produces. This is the lever
#                      that lets a bulk payer-audit request (R5) multiply
#                      retrieval, review, and release work WITHOUT multiplying
#                      intake work: intake is per request, retrieval is per
#                      chart.
# skill_tier         - which remote tier may work it. Routing by skill lives
#                      in skills.yaml; the tier is named here because it is an
#                      attribute of the request type in the spec's own table.
#
# Shares must sum to 1.00 (checked by tests/test_config_smoke.py).
# ---------------------------------------------------------------------
request_types:
  - code: R1
    name: "Patient, own records"
    share: 0.35
    skill_tier: tier_1
    charts_per_request: 1
  - code: R2
    name: "Patient-directed to a third party (family, app, personal representative)"
    share: 0.05
    skill_tier: tier_1
    charts_per_request: 1
  - code: R3
    name: "Provider continuity of care"
    share: 0.10
    skill_tier: tier_1
    charts_per_request: 1
  - code: R4
    name: "Insurance and payer, claims and utilization review"
    share: 0.12
    skill_tier: tier_2
    charts_per_request: 1
  - code: R5
    name: "Payer audit and risk adjustment (bulk chart retrieval)"
    share: 0.08
    skill_tier: tier_2
    charts_per_request: 10      # spec Section 1: bulk; worked in the daily queue
  - code: R6
    name: "Life and disability insurance, underwriting and claims"
    share: 0.05
    skill_tier: tier_2
    charts_per_request: 1
  - code: R7
    name: "Legal, attorney with patient authorization"
    share: 0.07
    skill_tier: tier_2
    charts_per_request: 1
  - code: R8
    name: "Legal, subpoena or court order"
    share: 0.05
    skill_tier: tier_2
    charts_per_request: 1
  - code: R9
    name: "Government and agency (disability determination, workers' comp)"
    share: 0.08
    skill_tier: tier_2
    charts_per_request: 1
  - code: R10
    name: "Records amendment or correction request"
    share: 0.03
    skill_tier: tier_2
    charts_per_request: 1
  - code: R11
    name: "Research and other"
    share: 0.02
    skill_tier: tier_2
    charts_per_request: 1

# ---------------------------------------------------------------------
# RECORD MEDIA (spec Section 1 "Record media")
#
# Where a chart physically lives decides who retrieves it and how long it
# takes. The three onsite media are the ones a Records Specialist has to
# walk to a cabinet for, and each one retrieved becomes a digitization item
# (W12), which is how the non-digital share falls over time.
#
# These shares must sum to 1.0: every chart lives somewhere, so W8, W9 and
# W11 between them cover the whole retrieval population exactly once.
# ---------------------------------------------------------------------
#
# Revised 10/22: this table is the ONLY source of retrieval times. W8, W9
# and W11 all read from it, so the two tables can never disagree about how
# long it takes to fetch a chart. Digital came down from 12 minutes to 10,
# representing a site converting to a workforce system - and at this volume
# each minute of digital retrieval is worth about 1.6 FTE across the
# network, which is why it is worth a row of its own rather than a constant
# buried in a work type.
record_media:
  - code: digital
    name: "Digital, in the client system"
    share: 0.85                        # spec Section 1
    retrieval_time_minutes: 10         # revised 10/22 from 12
    onsite: false
  - code: email_archive
    name: "Email archive"
    share: 0.04                        # spec Section 1
    retrieval_time_minutes: 20
    onsite: false
  - code: paper
    name: "Paper file"
    share: 0.07                        # spec Section 1
    retrieval_time_minutes: 25
    onsite: true
  - code: microfiche
    name: "Microfiche"
    share: 0.02                        # spec Section 1
    retrieval_time_minutes: 35
    onsite: true
  - code: archive_room
    name: "Archive room (oldest records)"
    share: 0.02                        # spec Section 1
    retrieval_time_minutes: 45
    onsite: true

# ---------------------------------------------------------------------
# LAG PROFILES (spec 3.3, approved 10/21)
#
# The WFM idea: the week a request ARRIVES is not the week all of its work
# gets done. Retrieval, review and release trail the request, and a status
# call can come days later. Putting work in the week it actually lands is
# what stops the plan from staffing a peak that has already passed.
#
# Each profile is a list of weekly shares starting at the source week, and
# each must sum to 1.0 - that is what makes the lag move work around without
# creating or destroying any (spec 9, Session 2).
# ---------------------------------------------------------------------
lag_profiles:
  in_week: [1.0]                       # spec 3.3: the week the request arrives
  split_70_30: [0.70, 0.30]            # spec 3.3: retrieval W8 to W10
  split_50_50: [0.50, 0.50]            # spec 3.3: W11/W13, review, release, calls, emails
  next_week: [0.0, 1.0]                # spec 3.3: digitization and rework, strictly after their parent
  spread_4_weeks: [0.25, 0.25, 0.25, 0.25]   # spec 3.3: amendment tracking to closure

# ---------------------------------------------------------------------
# WORK TYPES (spec Section 1 "Work types", approved 10/21)
#
# Session 2 needs only the VOLUME side of this table: what drives each work
# type and how much of it there is. Handle times, automation rates and
# deflection arrive in Sessions 3 and 5 and are deliberately absent here.
#
# basis   per_request - one unit of work per qualifying REQUEST
#         per_chart   - one unit per qualifying CHART. A bulk R5 request is
#                       10 charts, so retrieval and review multiply where
#                       intake does not - that is the whole point of the
#                       charts-per-request lever in Section 1
#         chained     - driven by the output of another work type rather
#                       than by requests, because digitization only happens
#                       for a retrieval that actually happened
# rate            the share of the basis that generates this work
# request_types   optional whitelist; a type not listed generates none
# rate_overrides  optional per-request-type rate, beating `rate`
# media           optional: the record media this row covers. The rate then
#                 comes from the record_media shares above, and one row is
#                 produced per medium so Session 3 can apply the 25/35/45
#                 minute retrieval times
# follows         chained rows only: the work type supplying the volume
# ---------------------------------------------------------------------
work_types:
  # --- Intake -------------------------------------------------------
  - code: W1
    name: "Request intake and logging"
    stage: intake
    owner: tier_1
    basis: per_request
    rate: 1.0                          # spec: every request
    handle_time_minutes: 6             # spec Section 1
    goal_business_days: 0.5            # spec 4.4: intake stage 0.5, same day
    in_turnaround: true
    lag: in_week
  - code: W2
    name: "Requester identity verification"
    stage: intake
    owner: tier_1
    basis: per_request
    rate: 1.0                          # spec: every request
    handle_time_minutes: 4             # spec Section 1
    goal_business_days: 0.5            # spec 4.4: intake stage 0.5, same day
    in_turnaround: true
    lag: in_week
  - code: W3
    name: "Fee and invoice processing"
    stage: intake
    owner: tier_1
    basis: per_request
    rate: 1.0
    request_types: [R4, R5, R6, R7]    # spec: billable requests, R4 to R7 (32%)
    handle_time_minutes: 3             # spec Section 1
    goal_business_days: 0.5            # spec 4.4: intake stage 0.5, same day
    in_turnaround: true
    lag: in_week
  - code: W4
    name: "Misroute handling"
    stage: intake
    owner: tier_1
    basis: per_request
    rate: 0.02                         # spec: 2% of requests
    handle_time_minutes: 3             # spec Section 1
    goal_business_days: 0.5            # spec 4.4: intake stage 0.5, same day
    in_turnaround: true
    lag: in_week
  # --- Validation ---------------------------------------------------
  - code: W5
    name: "Authorization validation"
    stage: validation
    owner: by_request_type
    basis: per_request
    rate: 1.0                          # spec: every request
    # Spec Section 1: 5 min Tier 1; 12 min Tier 2. Validating a subpoena
    # is a different job from validating a patient asking for their own
    # records, so the time follows the tier the request routes to.
    handle_time_minutes_by_tier:
      tier_1: 5
      tier_2: 12
    goal_business_days: 1              # spec 4.4: validation stage 1
    in_turnaround: true
    lag: in_week
  - code: W6
    name: "Incomplete-request outreach"
    stage: validation
    owner: tier_1
    basis: per_request
    rate: 0.12                         # spec: 12% of requests
    handle_time_minutes: 8             # spec Section 1
    goal_business_days: 1              # spec 4.4: validation stage 1
    in_turnaround: true
    lag: in_week
  - code: W7
    name: "Legal and sensitive-records review"
    stage: validation
    owner: tier_2
    basis: per_request
    rate: 0.08                         # spec: plus 8% of others
    rate_overrides: {R8: 1.0}          # spec: all R8, subpoena or court order
    handle_time_minutes: 15            # spec Section 1; human sign-off required
    goal_business_days: 2              # spec 4.4: validation exception: legal and sensitive-records review
    in_turnaround: true
    lag: in_week
  # --- Retrieval ----------------------------------------------------
  # W8, W9 and W11 partition the charts by where the record lives, so their
  # rates come from record_media and add to exactly 1.0. W10, W13 and W15
  # are ADDITIONAL passes over charts, not part of that partition.
  - code: W8
    name: "Digital retrieval"
    stage: retrieval
    owner: by_request_type
    basis: per_chart
    media: [digital]                   # spec: 85% of charts; time from record_media
    goal_business_days: 2              # spec 4.4: retrieval stage 2
    in_turnaround: true
    lag: split_70_30
  - code: W9
    name: "Email-archive retrieval"
    stage: retrieval
    owner: tier_1
    basis: per_chart
    media: [email_archive]             # spec: 4% of charts; time from record_media
    goal_business_days: 2              # spec 4.4: retrieval stage 2
    in_turnaround: true
    lag: split_70_30
  - code: W10
    name: "Multi-source compilation: imaging, lab, other departments"
    stage: retrieval
    owner: by_request_type
    basis: per_chart
    rate: 0.10                         # spec: 10% of charts, on top of the media split
    handle_time_minutes: 10            # spec Section 1
    goal_business_days: 2              # spec 4.4: retrieval stage 2
    in_turnaround: true
    lag: split_70_30
  - code: W11
    name: "Onsite retrieval: paper, microfiche, archive room"
    stage: retrieval
    owner: records_specialist
    basis: per_chart
    media: [paper, microfiche, archive_room]   # spec: 11% of charts
    # Times come from record_media (25 / 35 / 45). Walking to a filing
    # cabinet, threading a microfiche reader and digging through an archive
    # room are three different jobs, and the media mix is what decides the
    # hours.
    goal_business_days: 3              # spec 4.4: retrieval exception: onsite retrieval of old formats
    in_turnaround: true
    lag: split_50_50
  - code: W12
    name: "Digitization"
    stage: retrieval
    owner: records_specialist
    basis: chained
    follows: W11                       # spec: 1 per onsite retrieval
    rate: 1.0
    handle_time_minutes: 15            # spec Section 1
    goal_business_days: 10             # spec 4.4: off path: digitization, 10 days after retrieval
    in_turnaround: false
    lag: next_week                     # spec 3.3: the week after its onsite retrieval
  - code: W13
    name: "Missing or misfiled record search"
    stage: retrieval
    owner: records_specialist
    basis: per_chart
    rate: 0.01                         # spec: 1% of charts
    handle_time_minutes: 30            # spec Section 1
    goal_business_days: 3              # spec 4.4: retrieval exception: missing-record search
    in_turnaround: true
    lag: split_50_50
  # --- Review -------------------------------------------------------
  - code: W14
    name: "Quality review"
    stage: review
    owner: qa_specialist
    basis: per_chart
    handle_time_minutes: 6             # spec Section 1
    # Revised 10/22: risk-based coverage instead of reviewing every chart.
    # Full review where the cost of an error is highest - bulk payer audits
    # and anything going to a lawyer or a court - plus every chart that
    # needed redaction, since that is where a disclosure mistake would be
    # made. Everything else gets a sample.
    #
    # The redaction share is read from W15 rather than repeated, so the two
    # cannot drift apart, and the resulting rate for an ordinary request
    # type is 0.20 + 0.80 x 0.10 = 0.28.
    qa_coverage:
      full_for_request_types: [R5, R7, R8]   # spec: 100% of these charts
      full_for_work_type: W15                # any chart needing redaction
      sample_rate: 0.10                      # spec: 10% of all other charts
    goal_business_days: 1              # spec 4.4: review stage 1
    in_turnaround: true
    lag: split_50_50
  # Added 10/22. The other half of the QA change: the fulfiller checks
  # their own work on every chart before it leaves. A minute each is far
  # cheaper than a QA review, and it is what makes a 10% QA sample
  # defensible on the charts that no longer get a full second pair of eyes.
  - code: W24
    name: "Fulfiller self-check"
    stage: review
    owner: by_request_type             # the tier that did the work checks it
    basis: per_chart
    rate: 1.0                          # spec: every chart
    handle_time_minutes: 1             # spec Section 1
    goal_business_days: 1              # spec 4.4: review stage 1
    in_turnaround: true
    lag: split_50_50                   # spec 3.3: lagged like review

  - code: W15
    name: "Sensitive-information redaction"
    stage: review
    owner: tier_2
    basis: per_chart
    rate: 0.20                         # spec: 20% of charts
    handle_time_minutes: 8             # spec Section 1
    goal_business_days: 1              # spec 4.4: review stage 1
    in_turnaround: true
    lag: split_50_50
  # --- Release ------------------------------------------------------
  - code: W16
    name: "Release and delivery"
    stage: release
    owner: tier_1
    basis: per_request
    rate: 1.0                          # spec: every request
    handle_time_minutes: 3             # spec Section 1
    goal_business_days: 0.5            # spec 4.4: release stage 0.5
    in_turnaround: true
    lag: split_50_50
  - code: W17
    name: "Certified copies and notarization"
    stage: release
    owner: records_specialist
    basis: per_request
    rate: 1.0
    request_types: [R4, R7, R8]        # spec: R7, R8, and 20% of R4, about 14%
    rate_overrides: {R4: 0.20}
    handle_time_minutes: 10            # spec Section 1; notarization needs human sign-off
    goal_business_days: 1              # spec 4.4: release exception: certified copies and notarization
    in_turnaround: true
    lag: split_50_50
  - code: W18
    name: "Disclosure log entry"
    stage: release
    owner: tier_1
    basis: per_request
    rate: 1.0                          # spec: every release, and every request is released once
    handle_time_minutes: 1             # spec Section 1
    goal_business_days: 0.5            # spec 4.4: release stage 0.5
    in_turnaround: true
    lag: split_50_50
  # --- Onsite -------------------------------------------------------
  - code: W19
    name: "Walk-in requester"
    stage: onsite
    owner: onsite_associate
    basis: per_request
    rate: 0.15                         # spec: 0.15 per request
    handle_time_minutes: 8             # spec Section 1; Erlang C needs it (4.1)
    lag: in_week
  - code: W20
    name: "Status and help calls"
    stage: onsite
    owner: onsite_associate
    basis: per_request
    rate: 1.0                          # spec: 1.0 per request
    handle_time_minutes: 5             # spec Section 1; Erlang C needs it (4.1)
    lag: split_50_50
  - code: W21
    name: "Emails and portal messages"
    stage: onsite
    owner: onsite_associate
    basis: per_request
    rate: 0.80                         # spec: 0.8 per request
    handle_time_minutes: 4             # spec Section 1
    goal_business_days: 1              # spec 4.4: off path: onsite email, worked in idle time (4.2)
    in_turnaround: false
    lag: split_50_50
  # --- Follow-up ----------------------------------------------------
  - code: W22
    name: "Rework from QA failures"
    stage: follow_up
    owner: qa_specialist
    basis: chained
    follows: W14                       # spec: 3% of reviewed items
    rate: 0.03
    # Spec Section 1: half the original time. Derived from the step it
    # reworks rather than typed in, so the two cannot drift apart.
    handle_time_fraction_of:
      work_type: W14
      fraction: 0.5
    goal_business_days: 1              # spec 4.4: off path: rework
    in_turnaround: false
    lag: next_week                     # spec 3.3: the week after its quality review
  - code: W23
    name: "Amendment tracking to closure"
    stage: follow_up
    owner: tier_2
    basis: per_request
    rate: 1.0
    request_types: [R10]               # spec: all R10
    handle_time_minutes: 10            # spec Section 1
    goal_business_days: 10             # spec 4.4: off path: amendment tracking to closure
    in_turnaround: false
    lag: spread_4_weeks

# ---------------------------------------------------------------------
# LIVE QUEUES: Erlang C inputs (spec 4.1)
#
# Phones and the walk-in counter are the two places a person waits in REAL
# TIME. You cannot staff those to the average, because arrivals are random
# and some intervals pile up. Erlang C finds the smallest team that still
# hits the goal in the worst interval.
#
# The occupancy cap is the second half of the answer and the easier one to
# forget. A team can look fine on service level while sitting at 95% busy,
# which leaves no recovery time between contacts, burns people out, and
# collapses the moment one person is sick. The cap refuses that answer even
# when the service level would allow it.
# ---------------------------------------------------------------------
live_queues:
  interval_seconds: 1800               # spec 4.1: half-hour intervals, 18 a day
  occupancy_cap: 0.85                  # spec 4.1: never above 85% busy
  max_staff_search: 5000               # safety stop so a bad input cannot loop forever

  # Service goals (spec 4.1 and Section 1). Handle time is NOT here: it
  # belongs to the work type (W19, W20) and arrives with the rest of the
  # handle-time column, so erlang.py takes it as an argument instead.
  goals:
    - code: phones
      name: "Status and help calls"
      work_type: W20
      service_level: 0.80              # spec 4.1: 80% of calls
      target_seconds: 20               # spec 4.1: answered within 20 seconds
    - code: walk_ins
      name: "Walk-in requester"
      work_type: W19
      service_level: 0.90              # spec 4.1: 90% of walk-ins
      target_seconds: 600              # spec 4.1: served within 10 minutes

# ---------------------------------------------------------------------
# AUTOMATION, THE SUPPLY SIDE (spec 5.4, 5.5, 6.6)
#
# THE BASELINE KEEPS EVERY RATE AT ZERO. Turning automation on is a Session
# 5 scenario (spec 7.1), so the four rates below are 0% here and the
# machinery produces nothing. Everything else in this block is structural -
# uptime, the ramp, the costs - and sits at its spec value, ready for the
# scenario to switch on.
#
# The WFM idea, and the reason automation is a SUPPLY line rather than a
# discount on demand (spec 7.1, decided 10/21): deflection means the
# contact never arrives, automation means the work still arrives and a
# machine does it. A machine is therefore planned exactly like a hiring
# class - it has a capacity, a go-live date, a ramp and a cost - and it
# belongs in the Capacity Ledger beside the people.
#
# The part that catches planners out is 5.5. Automated work comes BACK.
# Exceptions return to the tier that owns the work, the QA sample goes to
# the QA team, and a legally required sign-off sends every single item to a
# person. An 8% target share does not free 8% of the hours.
# ---------------------------------------------------------------------
automation:
  # Plan week the automation goes live (spec 7.1 scenario table: week 13).
  # Harmless while the rates are zero.
  go_live_week: 13

  uptime: 0.98                         # spec 5.4
  ramp: [0.25, 0.50, 0.75, 1.00]       # spec 5.4: by week after go-live

  # Items per week the platform can take, network-wide per work type
  # (spec 5.4: "sized to the target share; adjustable"). null means sized
  # to the target share, so only uptime and the ramp hold it back - which
  # is the honest default, because a cap nobody has measured is a guess
  # dressed as a constraint.
  capacity_cap_items_per_week: null

  # --- the four supply-side rates (spec 7.1) -------------------------
  # Target share of eligible items
  #     = simple task share x (AI handling + automation displacement)
  #       x realization
  # Spec 7.1 DEFAULTS, for the Session 5 scenario: 0.40, 0.10, 0.10, 1.00,
  # which give the 8% target share named in 5.4. All zero here.
  rates:
    simple_task_share: 0.0             # 7.1 default 0.40
    ai_handling: 0.0                   # 7.1 default 0.10
    automation_displacement: 0.0       # 7.1 default 0.10
    realization: 1.0                   # 7.1 default 1.00
    # Spec 7.1: each rate can apply to all volume instead of the simple
    # share. True drops the simple-task-share factor from the formula.
    apply_to_all_volume: false

    # Which eligible work types the machine is actually pointed at (spec 7
    # "AI targeted", added 10/28). Empty means all of them, which is the
    # baseline and the plain AI run.
    #
    # It exists because setup dominates the spend: $10,000 a work type
    # spread over a year is $7,692 whether that row automates two thousand
    # items a week or a hundred, so switching a machine on across all 19
    # eligible rows buys 19 setups and the thin rows never earn theirs
    # back. Naming the rows that pay is the cheapest change available.
    only_work_types: []

  # The same split as the demand side (spec 7.1, decided 10/28). A machine
  # takes the SIMPLE items, so the ones left for people average more
  # minutes each - a calculated mix uplift - and anything beyond that is
  # an input nobody should assume.
  #
  # Neither is the same thing as human-in-the-loop (5.5), and the two are
  # never both charged for the same hour: the uplifts price the items
  # PEOPLE work, and the 5.5 multiples are measured against the BASE
  # handle time of the items the machine worked.
  #
  # Both apply only to automation-eligible work types, and only from the
  # scenario's starts week.
  easy_handle_time_relative: 0.50      # 7.1, decided 10/28
  extra_uplift: 0.0                    # 7.1, decided 10/28

  # --- cost (spec 5.4) ----------------------------------------------
  cost:
    ai_per_item: 0.50
    rule_per_item: 0.20
    # Decided 10/27 (spec 5.4): ONE shared fee for the whole network, not
    # one per work type. Split across the automated work types by each
    # one's share of that week's automated items, so a row that automated
    # nothing carries none of it.
    platform_per_week: 500
    setup_per_work_type: 10000         # one-time, per work type
    setup_spread_weeks: 52             # spread across a year

  # --- human-in-the-loop (spec 5.5) ---------------------------------
  #
  # Both multiples are measured against the EASY-ITEM handle time, not the
  # average one (decided 10/28). The machine takes the simple items, so an
  # exception on one of them is 1.5x a SIMPLE job - which at the 50% easy
  # ratio is 1.5 x 3 = 4.5 minutes on a W1 intake item, not 1.5 x 6 = 9.
  #
  # Charging 9 minutes was the same error the flat uplift made in reverse:
  # it priced the machine's leftovers as though the machine had been
  # working the hard end of the distribution all along. It cannot be both.
  #
  # The QA review is a flat 2 minutes either way - a reviewer looks at the
  # item, and the look does not get shorter because the item was simple.
  human_in_the_loop:
    exception_handle_time_multiple: 1.5   # spec 5.5, x the EASY-item time
    qa_review_minutes: 2                  # spec 5.5: flat, not a multiple
    sign_off_handle_time_multiple: 0.5    # spec 5.5, x the EASY-item time
    sign_off_rate: 1.0                    # spec 5.5: 100% where legally required

  # --- per work type (spec Section 1, last column) -------------------
  #
  # One row per work type, mirroring the "Automation: eligible ·
  # exceptions · QA" column of the Section 1 table so the two can be read
  # side by side.
  #
  #   kind         ai or rule, which sets the cost per item
  #   exception_rate   share the machine cannot finish (5.5)
  #   qa_sample_rate   share the QA team reviews (5.5)
  #   sign_off         none, all, or request_types - where a legal
  #                    requirement says a person must decide
  #   share_override   a row whose target share is fixed regardless of the
  #                    network rates; spec Section 1 sets W11 and W24 to 0%
  work_types:
    W1:  {eligible: true,  kind: ai,   exception_rate: 0.10, qa_sample_rate: 0.05, sign_off: none}
    W2:  {eligible: true,  kind: ai,   exception_rate: 0.15, qa_sample_rate: 0.10, sign_off: none}
    W3:  {eligible: true,  kind: rule, exception_rate: 0.05, qa_sample_rate: 0.02, sign_off: none}
    W4:  {eligible: true,  kind: ai,   exception_rate: 0.10, qa_sample_rate: 0.05, sign_off: none}
    W5:  {eligible: true,  kind: ai,   exception_rate: 0.15, qa_sample_rate: 0.10, sign_off: none}
    W6:  {eligible: true,  kind: ai,   exception_rate: 0.20, qa_sample_rate: 0.10, sign_off: none}
    # W7 legal and sensitive-records review: automation PREPS, a person
    # decides every item. Spec Section 1 and the "Human sign-off required"
    # paragraph: 100% sign-off, 100% QA.
    W7:  {eligible: true,  kind: ai,   exception_rate: 0.0,  qa_sample_rate: 1.00, sign_off: all}
    W8:  {eligible: true,  kind: ai,   exception_rate: 0.10, qa_sample_rate: 0.05, sign_off: none}
    W9:  {eligible: true,  kind: ai,   exception_rate: 0.20, qa_sample_rate: 0.10, sign_off: none}
    W10: {eligible: true,  kind: ai,   exception_rate: 0.20, qa_sample_rate: 0.10, sign_off: none}
    # W11 onsite retrieval is physical work - somebody walks to the archive
    # room. Spec Section 1: eligible in principle, default rate 0%.
    W11: {eligible: true,  kind: ai,   exception_rate: 0.0,  qa_sample_rate: 0.0,  sign_off: none, share_override: 0.0}
    W12: {eligible: true,  kind: ai,   exception_rate: 0.15, qa_sample_rate: 0.10, sign_off: none}
    W13: {eligible: true,  kind: ai,   exception_rate: 0.30, qa_sample_rate: 0.10, sign_off: none}
    W14: {eligible: true,  kind: ai,   exception_rate: 0.10, qa_sample_rate: 0.05, sign_off: none}
    W15: {eligible: true,  kind: ai,   exception_rate: 0.15, qa_sample_rate: 1.00, sign_off: none}
    # W16 release: R8 is a subpoena or court order, so those releases need
    # a person's decision (spec Section 1). The rest do not.
    W16: {eligible: true,  kind: ai,   exception_rate: 0.05, qa_sample_rate: 0.05, sign_off: request_types, sign_off_request_types: [R8]}
    # W17 certified copies and notarization. Copies automate; notarization
    # needs a person. Decided 10/27: notarization is the R8 path - a
    # notarised copy is what a court order gets, and spec Section 1 now
    # says so in the W17 row itself.
    W17: {eligible: true,  kind: ai,   exception_rate: 0.05, qa_sample_rate: 0.05, sign_off: request_types, sign_off_request_types: [R8]}
    W18: {eligible: true,  kind: rule, exception_rate: 0.02, qa_sample_rate: 0.02, sign_off: none}
    # W19, W20 and W21 are DEMAND-side (spec Section 1: kiosk, deflection).
    # The contact never arrives, so there is nothing for a supply-side
    # machine to do. Session 5 handles them through the 7.1 demand rates.
    W19: {eligible: false, kind: ai,   exception_rate: 0.0,  qa_sample_rate: 0.0,  sign_off: none}
    W20: {eligible: false, kind: ai,   exception_rate: 0.0,  qa_sample_rate: 0.0,  sign_off: none}
    W21: {eligible: false, kind: ai,   exception_rate: 0.0,  qa_sample_rate: 0.0,  sign_off: none}
    W22: {eligible: true,  kind: ai,   exception_rate: 0.15, qa_sample_rate: 0.10, sign_off: none}
    W23: {eligible: true,  kind: ai,   exception_rate: 0.10, qa_sample_rate: 0.10, sign_off: none}
    # W24 fulfiller self-check: spec Section 1 sets its default rate to 0%.
    W24: {eligible: true,  kind: ai,   exception_rate: 0.0,  qa_sample_rate: 0.0,  sign_off: none, share_override: 0.0}

# ---------------------------------------------------------------------
# NEXT DOLLAR (spec 6.6)
#
# The question a leader actually has to answer: the next dollar buys either
# an hour of somebody's time or an item through a machine - which one, and
# how soon does it start helping? Lead time is half the answer. Fourteen
# weeks from requisition to a productive Tier 1 hire is a long time to wait
# for relief that automation could start delivering in four.
# ---------------------------------------------------------------------
next_dollar:
  # Spec 6.6 measures the hire-by lead time to 90% ramp, the same threshold
  # 6.5 uses, so the two outputs cannot quote different numbers.
  human_ramp_threshold: 0.90

# ---------------------------------------------------------------------
# HIRING TRIGGER (spec 6.5; decided 10/26)
#
# The question this answers is not "are we short" but "are we short in a
# way that HIRING fixes". Three ideas do the work:
#
#   - A sustained gap, not a bad week. One short week is a scheduling
#     problem; three in a row is a staffing problem.
#   - Measured BEFORE overtime (decided 10/26). Overtime bridges short
#     dips and a new class's ramp-up; it is not the staffing plan. A
#     trigger measured after overtime would never fire until the cap ran
#     out, by which point the requisition is months too late.
#   - Grossed up for attrition. A class of 4 is not 4 people by the time
#     it reaches full speed, and hiring the gap exactly means hiring short.
# ---------------------------------------------------------------------
hiring:
  trigger_fte: 1.0                     # spec 6.5: short by MORE than 1 FTE
  trigger_weeks: 3                     # spec 6.5: 3 or more consecutive weeks
  minimum_class: 2                     # spec 6.5
  surplus_fte: 2.0                     # spec 6.5: over by more than 2 FTE
  surplus_weeks: 6                     # spec 6.5: for 6 or more weeks

  # The gross-up is measured to FULL ramp, not to 90%: the hire-by date
  # asks "when do they start carrying the load" (90% is close enough) but
  # the class size asks "how many are still here when they do" - and that
  # is the longer wait.
  gross_up_to_ramp: 1.0

  # A safety stop on the placement loop, which rebuilds the ledger after
  # every class. If it ever runs out, something is oscillating and the
  # plan should say so rather than loop forever.
  max_classes: 60

# ---------------------------------------------------------------------
# COVERAGE EVENTS (spec 6.7; defaults decided 10/26)
#
# Every time a site and role come up short, the model writes a row. The
# point is not the row: it is that a year later somebody can ask "how often
# did N3 need help, and why" and get an answer from data rather than from
# memory. That is why the cause is a field and not a comment.
#
# The model suggests the cause (F13) and a person confirms it (F15, F23,
# F24). The planned/unplanned tag (F14) is DERIVED from the cause, never
# typed, so the two can never disagree - and the distinction is the one a
# coverage plan actually needs, because planned time can be moved and
# unplanned time cannot.
# ---------------------------------------------------------------------
coverage_events:
  # Which roles are checked by day and which by week (spec 6.2, 10/26).
  # Live work at the counter cannot wait; a back-office queue can.
  daily_check_roles: [onsite_associate]

  # F13 causes, and the F14 tag each one carries. This list IS spec 6.7's
  # F13 enumeration, in the spec's own order, and it does double duty: a
  # shrinkage line is eligible to be the suggested cause only if it appears
  # here. That is why paid breaks and corporate needs are absent - spec
  # 6.7 does not list them, and "you were short because of paid breaks" is
  # not a finding anybody can act on.
  causes:
    volume_spike: unplanned
    vacation: planned
    sick: unplanned
    digital_training: planned
    offsite_training: planned
    meetings: planned
    one_on_ones: planned
    vacancy: unplanned
    onboarding: planned
    automation_outage: unplanned
    non_digital_surge: unplanned
    other: unplanned

  # A day whose required hours run this far above the role's own average is
  # called a volume spike rather than blamed on whoever happened to be out.
  volume_spike_threshold: 1.15

  # A vacancy means an empty seat. Below a whole person gone, the day is
  # better explained by whoever was away on it, so the cause falls through
  # to the biggest shrinkage line instead.
  vacancy_fte_threshold: 1.0

  # F22 action taken, by event type.
  actions:
    E1: borrow
    E2: overtime
    E3: accept gap
    E4: reprioritize

  # Records Specialist floor breach (spec 6.7, decided 10/26). Headcount is
  # continuous in this model, so 2.00 heads becomes 1.99 the week attrition
  # starts - and a fraction of a person leaving is not a person leaving. The
  # breach counts only when the ROUNDED headcount falls below the floor.
  floor_breach:
    round_headcount: true
    # Spec 6.5, decided 10/26: each breach opens a one-person requisition at
    # once, outside the minimum class size.
    backfill_requisition_people: 1
    # Recorded as the F24 follow-up (spec 6.7, decided 10/26) rather than as
    # a field of its own: it IS the follow-up, and a field nobody else fills
    # would have been a column of blanks on 1,300 rows.
    follow_up: "backfill requisition opened"

  # The person-entered fields (F15, F23, F24). Synthetic sample values, so
  # analysis works from day one - spec 6.7. No person-level IDs are stored,
  # only the role that signed off.
  sample_text:
    approved_by: ["site manager", "WFM"]
    notes:
      planned:
        - "Known in advance; cover arranged at the Monday huddle."
        - "On the leave calendar; backfill agreed with the lending site."
        - "On the schedule weeks ago; the queue took the hit anyway."
      unplanned:
        - "Called in on the morning; no notice."
        - "Short notice, cover sourced same day."
        - "Unexpected; absorbed into the queue where possible."
    # F24's values are spec 6.7's own list. "backfill requisition opened"
    # is absent on purpose: the model fills that one on a floor breach, so
    # no other row may draw it by accident.
    follow_up:
      - "none"
      - "hiring trigger raised"
      - "schedule change"
      - "process fix"
  sample_seed: 20261026

# ---------------------------------------------------------------------
# BACK-OFFICE BACKLOG (spec 4.3, 4.4)
#
# Work that can wait is planned as INVENTORY, not as a live queue. The
# question is not "how fast must we answer" but "how much is allowed to sit
# in the queue", and Little's Law answers it:
#
#     target backlog = daily arrivals x the goal in days
#
# A queue sitting at target is healthy, not behind. That is the idea people
# find counter-intuitive: a backlog of zero would mean the team is idle
# between arrivals, which costs more than it saves.
#
# Required hours then cover this week's arrivals PLUS a slice of whatever
# sits above target, spread over the catch-up period rather than cleared in
# one brutal week:
#
#     required hours = (arrivals + excess over target / catch-up weeks)
#                      x handle time / 60
#
# Limitation, also stated in the README: a weekly grain cannot see
# within-day aging, so a 1-day goal is checked as days of inventory rather
# than as a true response time.
# ---------------------------------------------------------------------
backlog:
  catch_up_weeks: 4                    # spec 4.3 default
  overall_turnaround_goal_days: 5      # spec Section 1 and 4.4

  # Spec 4.4: remote roles are one network queue - a Tier 1 Specialist works
  # the pipeline wherever the request came from. Records Specialists are
  # per site, because they walk to a filing cabinet in their own building.
  per_site_roles: [records_specialist]
  network_scope: NETWORK

  # Every queue starts the baseline at its target backlog (spec 4.3), so the
  # plan begins healthy rather than with an invented hole or pile.
  start_at_target: true

# ---------------------------------------------------------------------
# THE ONSITE TEAM (spec 4.1 and 4.2, decided 10/22)
#
# BLENDED QUEUE. Counter and phones are one team per site, not two queues.
# At a site taking a handful of walk-ins an hour, two separate queues would
# each need a person parked on them and would run near 20% occupancy - two
# people mostly waiting. In the real office the person at the counter picks
# up the phone between requesters, so the model pools them.
#
# Pooling is solved at the phones' stricter goal (80% in 20 seconds) on a
# volume-weighted handle time, then staff are raised if the walk-in goal
# (90% within 10 minutes) does not yet hold. The stricter goal usually
# binds, but checking both is what stops a blended team quietly failing the
# counter to flatter the phones.
#
# SUPPORT WORK. Email and portal messages are backlog work the same team
# does between live contacts, so it is worked first in whatever idle time
# the live-queue schedule already pays for. Only what does not fit adds
# hours, and only those added hours carry the paid-break allowance - the
# breaks inside the live schedule are already counted by 4.2.
# ---------------------------------------------------------------------
onsite_team:
  blended_queue: true                  # spec 4.1, decided 10/22
  # Which goal leads the pooled solve, and which is then checked and
  # topped up. Both come from live_queues.goals above.
  primary_goal: phones                 # the stricter target drives the solve
  secondary_goal: walk_ins             # raise staff until this holds too

  # RECORDS SPECIALISTS HELP THE COUNTER (spec 4.5, decided 10/26)
  #
  # A Records Specialist who has pulled every chart on the list is standing
  # in the same building as a queue. Spec 4.5 sends their spare hours to
  # walk-ins and phones - but only HALF of them, because they are not
  # reliably free at the moment the counter needs them: a chart pull takes
  # as long as it takes, and the help has to be spread across the day
  # rather than promised for a particular half-hour.
  #
  # The help changes WHO provides coverage, never how much is required.
  records_specialist_help:
    enabled: true
    share_of_spare: 0.5                # decided 10/26: half, not all
    # Their own work comes first (spec 4.5: onsite retrieval, then
    # digitization). Spare hours are what is left after all of it.
    own_work_types: [W11, W12, W13, W17]
    # Help never crosses a site boundary: they are standing in one building.
    cross_site: false

  support_work:
    work_type: W21                     # spec 4.2: emails and portal messages
    absorb_in_idle_time: true          # decided 10/22
    # Spec 5.2 lists paid breaks at 6.25%. Only the SPILLOVER hours carry
    # it: hours absorbed into idle live-queue time are already inside a
    # schedule whose breaks 4.2 has paid for.
    spillover_break_allowance: 0.0625

# ---------------------------------------------------------------------
# FTE BASIS (spec 5.1)
#
# Only the two inputs needed to express hours as FTE. The rest of 5.1 -
# headcount, attrition, lead times, ramp, cost - lands in Session 4, which
# is also where headcount gets tuned against required hours.
#
# Onsite Associate shrinkage is 21.75%, not the 28% of the other roles,
# because their paid breaks are built into the interval schedule by 4.2
# instead of being carried here. Counting them in both places would pay for
# the same break twice.
# ---------------------------------------------------------------------
fte:
  paid_hours_per_week: 40              # spec 5.1

  # TUNED 10/26 (spec 5.1). For each role and scope:
  #
  #     headcount = total required hours over the first 13 plan weeks
  #                 / what one person delivers over those same 13 weeks
  #                 rounded up, floored at 2 Records Specialists a site
  #
  # Per-person hours are read from the LEDGER - one person run through it -
  # rather than calculated beside it, so they carry both of the things the
  # ledger does to a head, which pull opposite ways:
  #   seasonality  Q1 is January to March, where vacation is lightest and
  #                sick time about a quarter heavier; a back-office person
  #                delivers 29.2 h a week here against 28.8 across the year
  #   attrition    a roster of N is not N people for 13 weeks; ignoring it
  #                sizes every team to its opening Monday and leaves it
  #                short by the end of the quarter
  #
  # The point is to open BALANCED, so every gap the Capacity Plan later
  # reports is caused by attrition, growth or a season rather than by an
  # opening number nobody can defend.
  #
  # Onsite Associate demand is the scheduled live-work hours left after
  # Records Specialists help (4.5) plus any email spillover, so the back
  # office is tuned first and the counter against the help it will get.
  #
  # Superseded placeholders, kept for the record: onsite_associate 12,
  # records_specialist 12, tier_1 22, tier_2 12, qa_specialist 6.
  starting_headcount:
    onsite_associate:                  # per site
      N1: 5
      N2: 5
      N3: 4
      S1: 5
      S2: 4
      S3: 5
    records_specialist:                # per site, floor of 2
      N1: 3
      N2: 3
      N3: 3
      S1: 3
      S2: 2                            # the floor binds here
      S3: 3
    tier_1: {NETWORK: 35}
    tier_2: {NETWORK: 33}
    qa_specialist: {NETWORK: 10}

  paid_shrinkage:
    onsite_associate: 0.2175           # spec 5.1; excludes breaks, see 4.2
    # Corrected 10/26: every back-office role is 28%, the sum of the 5.2
    # lines including the 6.25% paid-break line. The 26% in the old 5.1
    # table was an early placeholder; 21.75% above is the same 28% less
    # that break line, which is why onsite always reconciled and these did
    # not. 40 x (1 - 0.28) = 28.8 productive hours per FTE.
    records_specialist: 0.28
    tier_1: 0.28
    tier_2: 0.28
    qa_specialist: 0.28

# ---------------------------------------------------------------------
# INTRADAY PATTERN (spec 3.4, decided 10/22; curves revised 10/22)
#
# The WFM idea: a week's average hides the peaks, and Erlang C staffs to the
# peak. A site taking 500 calls a week is not the same problem as a site
# taking 100 on Monday morning and 20 on Friday afternoon, even though the
# weekly totals match. These two splits - across days, then across the
# half-hours inside a day - are what turn a weekly volume into something a
# live queue can be staffed against.
# ---------------------------------------------------------------------
intraday:
  # Day of week (spec 3.4, decided 10/22). Requests build up over the
  # weekend, so Monday carries the most and the week tapers off.
  # Must sum to 1.0.
  day_of_week_share:
    monday: 0.23
    tuesday: 0.21
    wednesday: 0.20
    thursday: 0.19
    friday: 0.17

  # Site hours (spec 3.4): Mon to Fri, 8:00 to 17:00 local, 18 half-hours.
  site_hours:
    opens: "08:00"
    closes: "17:00"
    interval_minutes: 30
    intervals_per_day: 18

  # -------------------------------------------------------------------
  # INTERVAL CURVES - APPROVED 10/22 by Siri from outputs/intraday_SYNTHETIC.png,
  # which is what spec 3.4 asks for before anything downstream relies on them.
  #
  # Both curves carry a lunch-hour bump at 12:00-13:00.
  # The first draft had its quietest point there, which assumed requesters
  # behave like office workers who stop at lunch. They are patients, carers
  # and clerks, and the hour they are free to chase a records request is
  # exactly their own lunch break. Both channels therefore lift at midday.
  # This matters for coverage, because the old shape put the deepest relief
  # hole on top of what is now a busy hour - see relief_placement below.
  #
  # Each curve is a share of its OWN day's volume and must sum to 1.0.
  # Keyed by interval start time so the shape is readable without counting
  # positions, and so a mis-keyed row fails loudly instead of silently
  # shifting the whole afternoon by one slot.
  # -------------------------------------------------------------------
  interval_curves:
    # Calls peak 8:00 to 10:00 (spec 3.4) - people ring first thing, often
    # about a request they made yesterday - and the first four half-hours
    # carry 38% of the day. A modest bump at 12:00-13:00 covers callers
    # using their own lunch break.
    calls:
      "08:00": 0.090
      "08:30": 0.095
      "09:00": 0.100
      "09:30": 0.095
      "10:00": 0.078
      "10:30": 0.066
      "11:00": 0.054
      "11:30": 0.044
      "12:00": 0.058      # lunch-hour bump
      "12:30": 0.054      # lunch-hour bump
      "13:00": 0.043
      "13:30": 0.042
      "14:00": 0.042
      "14:30": 0.038
      "15:00": 0.034
      "15:30": 0.030
      "16:00": 0.020
      "16:30": 0.017

    # Walk-ins carry both peaks (spec 3.4): late morning at 11:00 and early
    # afternoon at 14:00, with a modest lunch-hour bump between them -
    # somebody calling in person on their lunch break - sitting below both.
    walk_ins:
      "08:00": 0.018
      "08:30": 0.026
      "09:00": 0.036
      "09:30": 0.050
      "10:00": 0.064
      "10:30": 0.078
      "11:00": 0.088      # late-morning peak
      "11:30": 0.068
      "12:00": 0.074      # lunch-hour bump
      "12:30": 0.071      # lunch-hour bump
      "13:00": 0.062
      "13:30": 0.065
      "14:00": 0.080      # early-afternoon peak
      "14:30": 0.078
      "15:00": 0.060
      "15:30": 0.038
      "16:00": 0.026
      "16:30": 0.018

# ---------------------------------------------------------------------
# BREAKS AND LUNCH (spec 4.2, decided 10/22; placement revised 10/22)
#
# Erlang C says how many people must be AT the counter or ON the phones in
# an interval. Scheduled staff has to be higher, because some of the team is
# on break or at lunch right then:
#
#   Scheduled staff = staff needed / (1 - share away in that interval)
#
# Spec 4.2 counts every break exactly once, and which mechanism applies
# depends on how the team works:
#   - Onsite Associates (phones and counter): handled HERE, by interval, so
#     paid breaks are left out of their shrinkage in 5.2
#   - Back-office teams: handled through shrinkage instead, never here
#   - Onsite Associates' email and portal work: backlog work done between
#     live contacts, so it carries the 6.25% paid-break allowance, not this
#
# Teaching note from the spec: an unpaid lunch costs no pay but opens a
# coverage hole midday. That is why small sites are staffed for their peaks
# rather than for their hours.
# ---------------------------------------------------------------------
breaks_and_lunch:
  # Each person takes one relief of `minutes` somewhere in `window`. The
  # window average is fixed by minutes / window minutes, whatever the
  # placement rule: 15/120 = 12.5% for a break, 30/180 = 16.7% at lunch.
  reliefs:
    - code: morning_break
      name: "Morning paid break"
      minutes: 15
      paid: true                       # spec 4.2: paid, so it costs paid hours
      window: {from: "09:00", to: "11:00"}
    - code: lunch
      name: "Unpaid lunch"
      minutes: 30
      paid: false                      # spec 4.2: no pay, but a coverage hole
      window: {from: "11:00", to: "14:00"}
    - code: afternoon_break
      name: "Afternoon paid break"
      minutes: 15
      paid: true                       # spec 4.2
      window: {from: "14:00", to: "16:00"}

  # -------------------------------------------------------------------
  # RELIEF PLACEMENT (revised 10/22)
  #
  # The first draft spread each relief evenly across its window, which is
  # the simplest thing a model can do and the last thing a real team would.
  # A supervisor sends people to lunch when the floor is quiet.
  #
  # inverse_load does that: within a window, the share away in an interval
  # is inversely proportional to how busy that interval is, so the quiet
  # half-hours absorb most of the relief and the busy ones keep their cover.
  # The window TOTAL is unchanged - the same people take the same breaks -
  # so the average is still 12.5% and 16.7%. Only the distribution moves.
  #
  # max_share_per_interval stops the rule running away. Concentrating every
  # break into the single quietest half-hour would look optimal to the
  # arithmetic and be unmanageable on a rota, so no interval may send more
  # than this share of the team away at once. Excess is pushed back into the
  # next-quietest intervals until it fits.
  # -------------------------------------------------------------------
  relief_placement:
    method: inverse_load               # inverse_load | even
    max_share_per_interval: 0.25       # no more than a quarter of the team at once

    # What "busy" means (spec 3.4): volume x handle time, not contact count.
    # A call costs 5 minutes and arrives 1.0 per request; a walk-in costs 8
    # minutes but only 0.15 per request. So calls carry roughly four times
    # the onsite live load, and naming the work type here rather than a bare
    # weight keeps the two in step automatically.
    #
    # The onsite build uses the REAL per-interval load. These curve weights
    # reproduce the same shape for a typical week, for the standalone
    # intraday chart, which has no volumes behind it.
    load_curves:
      calls: W20
      walk_ins: W19

  # Which pool builds breaks into the interval rather than into shrinkage
  # (spec 4.2). Everyone else takes theirs through shrinkage in 5.2.
  built_into_intervals_for: [onsite_associate]

# ---------------------------------------------------------------------
# SUPPLY: roles, attrition, hiring lead times and ramp (spec 5.1, 5.3)
#
# The WFM idea: headcount is not capacity. A name on the roster is worth
# productive hours only after attrition, compliance training and system
# access, classroom training, a ramp to full speed, and shrinkage have all
# taken their cut. The gap between the two is where most capacity plans go
# wrong, and it is why hiring late costs more weeks than training alone
# suggests.
#
# before_productive_weeks is the stretch at 0%: a new hire cannot touch
# records until privacy training is done and access to each client's system
# is granted. Spec 5.1 splits it into compliance and training so the two
# constraints stay visible - they are relieved by different things.
#
# Starting headcount lives in fte.starting_headcount and is still the
# spec 5.1 default, UNTUNED. Decided 10/26: it becomes the average required
# FTE over the first 13 plan weeks, rounded up, never below the Records
# Specialist floor - that is task 4c, not this one.
# ---------------------------------------------------------------------
supply:
  # Which roles are staffed at a site and which are one network pool
  # (spec 4.4). A Tier 1 Specialist works the queue wherever the request
  # came from; an Onsite Associate stands at one counter.
  per_site_roles: [onsite_associate, records_specialist]
  network_scope: NETWORK

  roles:
    onsite_associate:
      monthly_attrition: 0.025         # spec 5.1
      requisition_weeks: 6             # spec 5.1: requisition to start date
      compliance_weeks: 0              # spec 5.1: site access sits inside training here
      training_weeks: 3                # spec 5.1: 3 weeks training and site access
      ramp: [0.50, 0.75, 0.90, 1.00]   # spec 5.1
      hourly_cost: 26                  # spec 5.1
      overtime_cap: 0.10               # spec 5.1
      overtime_pay_multiple: 1.5       # spec 5.1
    records_specialist:
      monthly_attrition: 0.015
      requisition_weeks: 6
      compliance_weeks: 2              # spec 5.1: compliance + system access
      training_weeks: 4
      ramp: [0.50, 0.75, 0.90, 1.00]
      hourly_cost: 30
      overtime_cap: 0.10
      overtime_pay_multiple: 1.5
    tier_1:
      monthly_attrition: 0.020
      requisition_weeks: 6
      compliance_weeks: 2
      training_weeks: 3
      ramp: [0.50, 0.75, 0.90, 1.00]
      hourly_cost: 28
      overtime_cap: 0.10
      overtime_pay_multiple: 1.5
    tier_2:
      monthly_attrition: 0.012
      requisition_weeks: 8             # spec 5.1: the longest lead time of the five
      compliance_weeks: 2
      training_weeks: 5
      ramp: [0.40, 0.60, 0.80, 1.00]   # spec 5.1: a slower ramp than the others
      hourly_cost: 36
      overtime_cap: 0.10
      overtime_pay_multiple: 1.5
    qa_specialist:
      monthly_attrition: 0.012
      requisition_weeks: 6
      compliance_weeks: 2
      training_weeks: 4
      ramp: [0.50, 0.75, 0.90, 1.00]
      hourly_cost: 32
      overtime_cap: 0.10
      overtime_pay_multiple: 1.5

# ---------------------------------------------------------------------
# SHRINKAGE LINES (spec 5.2; timing decided 10/26)
#
# Each line is its own input, tagged planned or unplanned, because the two
# behave differently when coverage is short: planned time can be moved, and
# unplanned time cannot. Lumping them into one percentage hides exactly the
# thing a coverage plan needs to know.
#
# Lines are also placed on SPECIFIC DAYS and weeks rather than spread
# evenly. A team losing 1% to meetings every day is a different operation
# from one losing 5% every Wednesday, even though the weekly average is
# identical - and it is the Wednesday that breaks.
#
# Onsite Associates have no paid-break line: spec 4.2 builds their breaks
# into the interval schedule instead, which is why their total is 21.75%
# against 28% for the back office. Counting it in both places would pay for
# the same break twice.
#
# Every line still averages its annual percentage: the week and day
# patterns redistribute time, they never create or destroy it.
# ---------------------------------------------------------------------
shrinkage:
  seed: 20261026                       # fixed, so the random sick line repeats
  normalize_to_annual_rate: true       # patterns redistribute, never add

  lines:
    - code: vacation
      name: "Vacation and PTO"
      planned: true                    # can be moved when coverage is short
      rate: 0.10                       # spec 5.2
      week_pattern: summer_and_year_end
      day_pattern: even
    - code: sick
      name: "Sick and unplanned"
      planned: false                   # cannot be moved; this is the risk line
      rate: 0.04                       # spec 5.2
      week_pattern: winter_sickness
      day_pattern: even
      # Decided 10/26 (spec 5.2): drawn SEPARATELY FOR EACH SITE, and by
      # day, so sites differ the way real ones do. Nobody schedules a sick
      # day, so there is no reason N1 and N2 should lose the same share of
      # Tuesday - and when they do, cluster coverage has nothing to work
      # with, because a site can only cover a neighbour on a day it is
      # better off than them.
      #
      # Each site's draw is normalised over the plan YEAR, so the line
      # still averages its 4% everywhere. The network pool is not a site
      # and keeps the shared series: one remote team, one sick pattern.
      per_site_draw: true
      per_site_relative_std_dev: 0.30  # matches the week-level noise below
    - code: paid_breaks
      name: "Paid breaks"
      planned: true
      rate: 0.0625                     # spec 5.2
      # NOT Onsite Associates: spec 4.2 builds their breaks into the
      # interval schedule, so this line would be the second payment.
      roles: [records_specialist, tier_1, tier_2, qa_specialist]
      week_pattern: flat
      day_pattern: even
    - code: digital_training
      name: "Digital training"
      planned: true
      rate: 0.02                       # spec 5.2
      week_pattern: flat
      day_pattern: tuesday_to_thursday # decided 10/26
    - code: offsite_training
      name: "Offsite training"
      planned: true
      rate: 0.0175                     # spec 5.2
      week_pattern: flat
      day_pattern: tuesday_to_thursday # decided 10/26
    - code: meetings
      name: "Meetings"
      planned: true
      rate: 0.01                       # spec 5.2
      week_pattern: flat
      day_pattern: wednesday           # decided 10/26
    - code: one_on_ones
      name: "One-on-ones"
      planned: true
      rate: 0.01                       # spec 5.2
      week_pattern: flat
      day_pattern: even                # decided 10/26: spread evenly
    - code: corporate_needs
      name: "Corporate needs"
      planned: true
      rate: 0.02                       # spec 5.2
      week_pattern: flat
      day_pattern: even

  # Across the weeks of the year. Weights are relative; the series is
  # rescaled afterwards so the line still averages its annual rate.
  week_patterns:
    flat:
      default: 1.0
    summer_and_year_end:               # decided 10/26
      default: 1.0
      periods:
        - name: "Summer"
          from: {month: 6, day: 1}
          to: {month: 8, day: 31}
          weight: 2.0
        - name: "Year end"
          from: {month: 12, day: 18}
          to: {month: 12, day: 31}
          weight: 2.0
    winter_sickness:                   # decided 10/26
      default: 1.0
      periods:
        - name: "January to March"
          from: {month: 1, day: 1}
          to: {month: 3, day: 31}
          weight: 1.25                 # about a quarter higher
      # Sick time is the one line nobody schedules, so it carries week to
      # week noise on top of the season. Fixed seed, and normalised after,
      # so the year still averages 4%.
      noise:
        relative_std_dev: 0.30

  # Across Monday to Friday. Weights are relative and are rescaled so the
  # five days average 1.0, which keeps the weekly total unchanged.
  day_patterns:
    even: {monday: 1, tuesday: 1, wednesday: 1, thursday: 1, friday: 1}
    tuesday_to_thursday: {monday: 0, tuesday: 1, wednesday: 1, thursday: 1, friday: 0}
    wednesday: {monday: 0, tuesday: 0, wednesday: 1, thursday: 0, friday: 0}

